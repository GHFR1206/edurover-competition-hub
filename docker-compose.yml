services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: nanorobotic-app:latest
    container_name: nanorobotic_app
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "${APP_HTTP_PORT:-8010}:80"
    volumes:
      - ./:/var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: nanorobotic
      DB_USERNAME: nanorobotic
      DB_PASSWORD: secret
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nanorobotic

  db:
    image: mysql:8.0
    container_name: nanorobotic_db
    restart: unless-stopped
    ports:
      - "${DB_HTTP_PORT:-3310}:3306"
    environment:
      MYSQL_DATABASE: nanorobotic
      MYSQL_USER: nanorobotic
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - nanorobotic-dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - nanorobotic

  queue:
    image: nanorobotic-app:latest
    container_name: nanorobotic_queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=120"]
    volumes:
      - ./:/var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: nanorobotic
      DB_USERNAME: nanorobotic
      DB_PASSWORD: secret
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nanorobotic

  reverb:
    image: nanorobotic-app:latest
    container_name: nanorobotic_reverb
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "${REVERB_HTTP_PORT:-8090}:8080"
    volumes:
      - ./:/var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: nanorobotic
      DB_USERNAME: nanorobotic
      DB_PASSWORD: secret
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nanorobotic

volumes:
  nanorobotic-dbdata:

networks:
  nanorobotic:
    driver: bridge
